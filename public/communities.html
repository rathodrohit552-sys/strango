<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Communities - Strango</title>
  <meta name="description" content="Explore Strango communities for AI, gaming, finance, geopolitics, Bollywood, Hollywood, self improvement, beauty, and FIFA 2026 discussions.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://strango.xyz/communities">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme.js"></script>
  <script src="https://unpkg.com/framer-motion@12.27.1/dist/framer-motion.js" defer></script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/pages/communities/community-list-page.js"></script>
  <script type="module" src="/pages/communities/community-detail-page.js"></script>
</head>
<body class="social-app-page communities-page">
  <div class="app-mobile-bar">
    <button class="sidebar-toggle" type="button" aria-label="Open navigation" data-sidebar-toggle><span class="sidebar-toggle-bars" aria-hidden="true"></span></button>
    <a class="brand" href="/app" aria-label="Strango app home">
      <span class="brand-mark">S</span>
      <span>Strango</span>
    </a>
  </div>
  <div class="app-sidebar-overlay" data-sidebar-overlay></div>

  <div class="app-shell">
    <aside class="app-sidebar" data-app-sidebar></aside>
    <main class="app-main">
      <section id="communitiesListPage" class="communities-list-page app-content-panel">
        <div class="app-page-heading">
          <p class="eyebrow">Communities</p>
          <h1>Find your Strango community.</h1>
          <p>Jump into focused spaces for fast, realistic discussions across culture, money, games, technology, football, and personal growth.</p>
        </div>
        <div class="community-list-actions">
          <button class="button primary" type="button" data-open-create-post>Create Post</button>
        </div>
        <div class="community-grid" data-community-list aria-label="Strango communities"></div>
        <button class="button primary sticky-create-post" type="button" data-open-create-post>Create Post</button>
      </section>

      <div id="communityDetailPage" class="community-detail-page"></div>
    </main>
  </div>
</body>
</html>
