<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Strango App</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme.js"></script>
  <script src="https://unpkg.com/framer-motion@12.27.1/dist/framer-motion.js" defer></script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/pages/app/app-router.js"></script>
</head>
<body class="social-app-page app-platform-page">
  <div class="app-mobile-bar">
    <button class="sidebar-toggle" type="button" aria-label="Open navigation" data-sidebar-toggle><span class="sidebar-toggle-bars" aria-hidden="true"></span></button>
    <a class="brand" href="/" aria-label="Go to Strango home">
      <span class="brand-mark">S</span>
      <span>Strango</span>
    </a>
  </div>
  <div class="app-sidebar-overlay" data-sidebar-overlay></div>

  <div class="app-shell">
    <aside class="app-sidebar" data-app-sidebar></aside>
    <main class="app-main">
      <div id="appRoot" class="app-content-panel"></div>
    </main>
  </div>
</body>
</html>
